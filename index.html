<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="container">
            <nav class="nav">
                <ul class="menu">
                    <li class="menu_item"><a href="#about_me" class="menu_link">about me</a></li>
                    <li class="menu_item"><a href="#about_me" class="menu_link">education</a></li>
                    <li class="menu_item"><a href="#skills" class="menu_link">skills</a></li>
                    <li class="menu_item"><a href="#code" class="menu_link">code</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <section class="introduction">
            <div class="container">
                <div class="introduction_me">
                    <div class="introduction__ava-wrapper">
                        <div class="introduction_underlay introduction__ava_underlay"></div>
                        <img src="img/photo_ava.jpg" class="introduction__ava"
                            alt="A man outside at the wooden table with laptop in the summer">
                    </div>
                    <h1 id="about_me">dmitry savin</h1>
                    <div class="introduction_post">
                        junior front-end developer
                    </div>
                </div>
                <div class="info_wrapper">
                    <div class="about_me item ">
                        <div class="background_title">
                            <div class="title">
                                About Me
                            </div>
                        </div>
        </section>
        <section class="skills_bar">
            <div class="container">
                <h2 class="skills" id="skills">My skills</h2>
                <div class="progress_bars_wrapper">
                    <div class="progress_bar_item">
                        <div class="progress_text">HTML
                            <span>90</span>%
                        </div>
                        <div class="progress_percent html"></div>
                    </div>
                    <div class="progress_bar_item">
                        <div class="progress_text">CSS
                            <span>85</span>%
                        </div>
                        <div class="progress_percent css"></div>
                    </div>
                    <div class="progress_bar_item">
                        <div class="progress_text">Javascript
                            <span>75</span>%
                        </div>
                        <div class="progress_percent javascript"></div>
                    </div>
                    <div class="progress_bar_item">
                        <div class="progress_text">GIT
                            <span>80</span>%
                        </div>
                        <div class="progress_percent git"></div>
                    </div>
                </div>
            </div>
        </section>
        <section class="code"></section>
    </main>
</body>

</html>
